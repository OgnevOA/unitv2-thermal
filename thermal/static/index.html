<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UnitV2 Thermal</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c3038; --text:#e6e8eb; --dim:#8a919c; --accent:#ff7a3d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  .wrap { display:grid; grid-template-columns: minmax(0,1fr) 320px; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
  [hidden] { display:none !important; }
  .view { position:relative; }
  .stage { position:relative; width:100%; aspect-ratio:4/3; background:#000; border-radius:8px; overflow:hidden; }
  .stage img, .stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .modebar { display:flex; align-items:center; gap:6px; margin-top:8px; color:var(--dim); font-size:12px; flex-wrap:wrap; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:4px 12px; }
  .seg button.on { background:var(--accent); color:#111; font-weight:600; }
  .stats { color:var(--dim); font:12px ui-monospace, monospace; margin-top:8px; white-space:pre-wrap; }
  .hint { color:var(--dim); font-size:12px; margin-top:8px; }
  kbd { background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:0 4px; font-size:11px; }
  details { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
  summary { padding:10px 12px; cursor:pointer; font-weight:600; }
  .body { padding:2px 12px 12px; }
  .row { display:grid; grid-template-columns: 110px 1fr 52px; align-items:center; gap:8px; margin:6px 0; }
  .row label { color:var(--dim); }
  .row output { text-align:right; font:12px ui-monospace, monospace; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  select, input[type=text], input[type=number] { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #msg { min-height:1.4em; color:var(--accent); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="view">
    <div class="stage" id="stage">
      <img id="stream" alt="thermal overlay stream">
      <img id="cam" alt="camera" hidden>
      <canvas id="ov" hidden></canvas>
    </div>
    <div class="modebar">Drawing
      <span class="seg"><button data-mode="server">UnitV2</button><button data-mode="browser">This browser</button></span>
      <span id="modeinfo"></span>
    </div>
    <div class="stats" id="stats">…</div>
    <div class="hint">Calibrate: point at a warm object 1–2 m away. <kbd>←↑→↓</kbd> move, <kbd>+</kbd>/<kbd>−</kbd> scale,
      <kbd>Shift</kbd> = fine, <kbd>H</kbd>/<kbd>V</kbd> flip, <kbd>O</kbd> outline.</div>
  </div>
  <div id="panel">
    <div id="msg"></div>
  </div>
</div>
<script>
// Control definitions: [key, label, type, min, max, step]
const GROUPS = [
  ["Overlay", true, [
    ["alpha", "Opacity", "range", 0, 1, 0.01],
    ["colormap", "Palette", "choice"],
    ["interp", "Smoothing", "choice"],
    ["hot_only", "Hot only", "bool"],
    ["hot_threshold", "Hot ≥ °C", "range", 0, 100, 0.5],
  ]],
  ["Temperature range", true, [
    ["range_mode", "Mode", "choice"],
    ["t_min", "Min °C", "range", -20, 100, 0.5],
    ["t_max", "Max °C", "range", -20, 150, 0.5],
    ["min_span", "Min span", "range", 0.5, 20, 0.5],
    ["range_smooth", "Auto smooth", "range", 0.02, 1, 0.01],
  ]],
  ["Alignment", true, [
    ["scale_x", "Scale X", "range", 0.2, 3, 0.005],
    ["scale_y", "Scale Y", "range", 0.2, 3, 0.005],
    ["off_x", "Offset X", "range", -1, 1, 0.002],
    ["off_y", "Offset Y", "range", -1, 1, 0.002],
    ["flip_h", "Mirror H", "bool"],
    ["flip_v", "Flip V", "bool"],
    ["show_outline", "Outline", "bool"],
  ]],
  ["Display", false, [
    ["show_hud", "HUD", "bool"],
    ["jpeg_quality", "JPEG quality", "range", 30, 95, 1],
    ["max_fps", "Max fps", "range", 1, 30, 1],
  ]],
  ["Sensor", false, [
    ["serial_dev", "UART device", "text"],
    ["serial_baud", "UART baud", "text"],
    ["checksum", "Checksum", "choice"],
    ["thermal_timeout", "Timeout s", "range", 0.5, 10, 0.5],
  ]],
];

let cfg = {}, choices = {}, pending = {}, timer = null;
const msg = t => { document.getElementById("msg").textContent = t; };

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

function queue(key, value) {
  pending[key] = value; cfg[key] = value;
  draw();
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const send = pending; pending = {};
    try { await api("/api/config", send); msg(""); } catch (e) { msg("Error: " + e.message); }
  }, 120);
}

function fmt(v) { return typeof v === "number" ? (Math.abs(v) < 10 ? v.toFixed(3).replace(/\.?0+$/, "") || "0" : v.toFixed(1)) : v; }

function build() {
  const panel = document.getElementById("panel");
  for (const [title, open, items] of GROUPS) {
    const d = document.createElement("details"); d.open = open;
    d.innerHTML = `<summary>${title}</summary><div class="body"></div>`;
    const body = d.querySelector(".body");
    for (const [key, label, type, min, max, step] of items) {
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<label for="c_${key}">${label}</label>`;
      let el, out = document.createElement("output");
      if (type === "range") {
        el = Object.assign(document.createElement("input"), { type: "range", min, max, step });
        el.oninput = () => { const v = parseFloat(el.value); out.textContent = fmt(v); queue(key, v); };
      } else if (type === "bool") {
        el = Object.assign(document.createElement("input"), { type: "checkbox" });
        el.style.justifySelf = "start";
        el.onchange = () => queue(key, el.checked);
      } else if (type === "choice") {
        el = document.createElement("select");
        for (const c of choices[key] || []) el.add(new Option(c, c));
        el.onchange = () => queue(key, el.value);
      } else {
        el = Object.assign(document.createElement("input"), { type: "text" });
        el.onchange = () => queue(key, el.value);
      }
      el.id = "c_" + key; el.dataset.key = key; el.dataset.type = type;
      row.append(el, out); body.append(row);
    }
    if (title === "Sensor") {
      const b = document.createElement("div"); b.className = "btns";
      b.innerHTML = `<span style="color:var(--dim);align-self:center">Module rate:</span>` +
        [1, 2, 4, 8].map(h => `<button data-rate="${h}">${h} Hz</button>`).join("") +
        `<button data-baud="460800">→ 460800 baud</button><button data-baud="115200">→ 115200 baud</button>` +
        `<button data-save="1">Save to module</button>`;
      b.onclick = async e => {
        const t = e.target.dataset; let body = null;
        if (t.rate) body = { rate: +t.rate };
        if (t.baud) body = { baud: +t.baud };
        if (t.save) body = { save: true };
        if (!body) return;
        try { const r = await api("/api/mlx", body); msg("Sent: " + r.sent.join(", ")); if (t.baud) await load(); }
        catch (err) { msg("Error: " + err.message); }
      };
      body.append(b);
    }
    panel.append(d);
  }
}

function sync() {
  for (const el of document.querySelectorAll("[data-key]")) {
    const v = cfg[el.dataset.key];
    if (el.dataset.type === "bool") el.checked = !!v; else el.value = v;
    const out = el.parentElement.querySelector("output");
    if (out && el.dataset.type === "range") out.textContent = fmt(v);
  }
}

async function load() {
  const j = await api("/api/config");
  cfg = j.config; choices = j.choices;
  if (!document.querySelector("[data-key]")) build();
  sync();
  draw();
}

async function pollStats() {
  try {
    const s = await api("/api/stats"), t = s.thermal || {};
    let txt = (mode === "browser"
        ? `drawing in this browser · thermal ${thFps.toFixed(1)} fps · camera viewers ${s.camera_viewers}\n`
        : `out ${s.out_fps} fps · viewers ${s.viewers}\n`) +
      `thermal ${t.dev} @ ${t.baud || "-"}: ${t.fps} fps, ok ${t.frames_ok ?? "-"}, bad ${t.frames_bad ?? "-"}` +
      (t.error ? `\n⚠ ${t.error}` : "");
    if (s.camera) txt += `\ncamera ${s.camera.src}: ${s.camera.fps} fps` + (s.camera.mode ? ` (${s.camera.mode})` : "") +
      (s.camera.error ? ` ⚠ ${s.camera.error}` : "");
    document.getElementById("stats").textContent = txt;
  } catch (e) { document.getElementById("stats").textContent = "stats unavailable: " + e.message; }
}

// Keyboard calibration.
document.addEventListener("keydown", e => {
  if (e.target.matches("input[type=text], select")) return;
  const fine = e.shiftKey ? 0.2 : 1, d = 0.01 * fine, s = 0.02 * fine;
  const bump = (k, dv, lo, hi) => { queue(k, Math.min(hi, Math.max(lo, +(cfg[k] + dv).toFixed(4)))); sync(); };
  switch (e.key) {
    case "ArrowLeft":  bump("off_x", -d, -1, 1); break;
    case "ArrowRight": bump("off_x",  d, -1, 1); break;
    case "ArrowUp":    bump("off_y", -d, -1, 1); break;
    case "ArrowDown":  bump("off_y",  d, -1, 1); break;
    case "+": case "=": bump("scale_x", s, 0.2, 3); bump("scale_y", s, 0.2, 3); break;
    case "-": case "_": bump("scale_x", -s, 0.2, 3); bump("scale_y", -s, 0.2, 3); break;
    case "h": case "H": queue("flip_h", !cfg.flip_h); sync(); break;
    case "v": case "V": queue("flip_v", !cfg.flip_v); sync(); break;
    case "o": case "O": queue("show_outline", !cfg.show_outline); sync(); break;
    default: return;
  }
  e.preventDefault();
});

// ---------------------------------------------------------------------------
// Browser-side drawing: camera MJPEG in <img id=cam>, thermal layer + HUD on <canvas id=ov>.
// Same geometry, range and palettes as thermal/overlay.py, so both modes look alike.
// ---------------------------------------------------------------------------
const COLS = 32, ROWS = 24;
let mode = "server", palettes = null;
let es = null, th = null, thAt = 0, thFps = 0, msgTimes = [], rangeLo = null, rangeHi = null;
const srcCv = Object.assign(document.createElement("canvas"), { width: COLS + 2, height: ROWS + 2 });
const srcCtx = srcCv.getContext("2d");
const midCv = document.createElement("canvas");
const midCtx = midCv.getContext("2d", { willReadFrequently: true });
const barCv = Object.assign(document.createElement("canvas"), { width: 1, height: 256 });
let barFor = null;

try { mode = localStorage.getItem("drawMode") === "browser" ? "browser" : "server"; } catch (e) {}
{ const q = new URLSearchParams(location.search).get("draw"); if (q === "browser" || q === "server") mode = q; }  // ?draw=browser

function freshImg(id) {
  // A new element, so the old MJPEG connection is really closed.
  const old = document.getElementById(id), n = document.createElement("img");
  n.id = id; n.alt = old.alt;
  old.src = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
  old.replaceWith(n);
  return n;
}

function setMode(m) {
  mode = m;
  try { localStorage.setItem("drawMode", m); } catch (e) {}
  const stream = freshImg("stream"), cam = freshImg("cam"), ov = document.getElementById("ov");
  const browser = m === "browser";
  stream.hidden = browser; cam.hidden = !browser; ov.hidden = !browser;
  if (browser) { cam.src = "/camera"; startThermal(); } else { stream.src = "/stream"; stopThermal(); }
  for (const b of document.querySelectorAll(".seg button")) b.classList.toggle("on", b.dataset.mode === m);
  document.getElementById("modeinfo").textContent = browser
    ? "camera + temperatures are sent separately; your device draws the overlay"
    : "the UnitV2 draws the overlay (works everywhere, e.g. Home Assistant)";
  draw();
}

function startThermal() {
  if (es) return;
  es = new EventSource("/api/thermal/stream");
  es.onmessage = ev => {
    const d = JSON.parse(ev.data), now = performance.now();
    msgTimes.push(now);                       // fps = messages in the last 3 s (robust to bursts)
    while (msgTimes.length && now - msgTimes[0] > 3000) msgTimes.shift();
    thFps = msgTimes.length > 1 ? (msgTimes.length - 1) * 1000 / Math.max(now - msgTimes[0], 1) : 0;
    const t = new Float32Array(d.t.length);
    let mn = Infinity, mx = -Infinity, imin = 0, imax = 0;
    for (let i = 0; i < t.length; i++) {
      const v = d.t[i] / 100; t[i] = v;
      if (v < mn) { mn = v; imin = i; }
      if (v > mx) { mx = v; imax = i; }
    }
    th = { t, amb: d.amb, min: mn, max: mx, imin, imax };
    thAt = now - (d.age || 0) * 1000;
    // Auto range: EMA once per thermal frame, like the server.
    if (rangeLo === null) { rangeLo = mn; rangeHi = mx; }
    else { const k = +cfg.range_smooth; rangeLo += k * (mn - rangeLo); rangeHi += k * (mx - rangeHi); }
    draw();
  };
}

function stopThermal() {
  if (es) { es.close(); es = null; }
  th = null; rangeLo = rangeHi = null; thFps = 0; msgTimes = [];
}

function currentRange() {
  let lo, hi;
  if (cfg.range_mode === "manual") { lo = +cfg.t_min; hi = +cfg.t_max; } else { lo = rangeLo; hi = rangeHi; }
  const span = Math.max(hi - lo, +cfg.min_span, 0.1), mid = (hi + lo) / 2;
  if (hi - lo < span) { lo = mid - span / 2; hi = mid + span / 2; }
  return [lo, hi];
}

function geometry(w, h) {
  // overlay.thermal_rect + overlay.affine (pixel-centre convention).
  const rw = cfg.scale_x * w, rh = cfg.scale_y * h;
  const x0 = w / 2 + cfg.off_x * w - rw / 2, y0 = h / 2 + cfg.off_y * h - rh / 2;
  const sx = rw / COLS, sy = rh / ROWS;
  return {
    x0, y0, rw, rh,
    ax: cfg.flip_h ? -sx : sx, bx: cfg.flip_h ? x0 + (COLS - 0.5) * sx - 0.5 : x0 + 0.5 * sx - 0.5,
    ay: cfg.flip_v ? -sy : sy, by: cfg.flip_v ? y0 + (ROWS - 0.5) * sy - 0.5 : y0 + 0.5 * sy - 0.5,
  };
}

function sample(u, v) {
  // Bilinear temperature at grid coordinates (col, row), clamped to the edges.
  u = Math.min(Math.max(u, 0), COLS - 1); v = Math.min(Math.max(v, 0), ROWS - 1);
  const c0 = Math.floor(u), r0 = Math.floor(v), c1 = Math.min(c0 + 1, COLS - 1), r1 = Math.min(r0 + 1, ROWS - 1);
  const fu = u - c0, fv = v - r0, t = th.t;
  const top = t[r0 * COLS + c0] * (1 - fu) + t[r0 * COLS + c1] * fu;
  const bot = t[r1 * COLS + c0] * (1 - fu) + t[r1 * COLS + c1] * fu;
  return top * (1 - fv) + bot * fv;
}

function hudText(ctx, s, x, y, size, color, k) {
  // Rough match for cv2.FONT_HERSHEY_SIMPLEX at `size`, with the same 4-way black shadow.
  ctx.font = `${Math.round(size * 30 * k)}px system-ui, sans-serif`;
  ctx.fillStyle = "#000";
  for (const [dx, dy] of [[1, 1], [-1, -1], [1, -1], [-1, 1]]) ctx.fillText(s, x + dx * k, y + dy * k);
  ctx.fillStyle = color || "#fff";
  ctx.fillText(s, x, y);
}

function marker(ctx, x, y, size, width, color, tilted) {
  const r = size / 2;
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath();
  if (tilted) { ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); }
  else { ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); }
  ctx.stroke();
}

function draw() {
  if (mode !== "browser" || !palettes || !cfg.colormap) return;
  const ov = document.getElementById("ov");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.round(ov.clientWidth * dpr), H = Math.round(ov.clientHeight * dpr);
  if (!W || !H) return;
  if (ov.width !== W || ov.height !== H) { ov.width = W; ov.height = H; }
  const ctx = ov.getContext("2d");
  ctx.clearRect(0, 0, W, H);
  ctx.textBaseline = "alphabetic";
  const k = W / 640;                  // HUD sizes are given for the server's 640-px frame
  const fresh = th && (performance.now() - thAt) / 1000 <= +cfg.thermal_timeout;
  if (!fresh) {
    if (cfg.show_hud) hudText(ctx, "no thermal data", 10 * k, 24 * k, 0.6, "#ff3030", k);
    return;
  }
  const g = geometry(W, H), [lo, hi] = currentRange();
  const lut = palettes[cfg.colormap] || Object.values(palettes)[0];

  // 1. Grid -> 34x26 image with replicated edges. R = normalised temperature,
  //    G = 128 + (temperature - hot threshold) on the same scale: interpolation keeps it linear,
  //    so G >= 128 after upscaling marks the same edge as thresholding the smoothed temperature.
  const img = srcCtx.createImageData(COLS + 2, ROWS + 2), px = img.data, sc = 255 / (hi - lo), thr = +cfg.hot_threshold;
  for (let y = 0; y < ROWS + 2; y++) {
    const r = Math.min(Math.max(y - 1, 0), ROWS - 1);
    for (let x = 0; x < COLS + 2; x++) {
      const c = Math.min(Math.max(x - 1, 0), COLS - 1), v = th.t[r * COLS + c], o = (y * (COLS + 2) + x) * 4;
      px[o] = Math.max(0, Math.min(255, (v - lo) * sc));
      px[o + 1] = Math.max(0, Math.min(255, 128 + (v - thr) * sc));
      px[o + 3] = 255;
    }
  }
  srcCtx.putImageData(img, 0, 0);

  // 2. Upscale (the browser's smoothing = Smoothing setting), flip, then colourise per pixel.
  const mw = Math.max(1, Math.min(Math.round(Math.abs(g.rw)), 640));
  const mh = Math.max(1, Math.min(Math.round(Math.abs(g.rh)), 480));
  midCv.width = mw; midCv.height = mh;
  midCtx.imageSmoothingEnabled = cfg.interp !== "nearest";
  midCtx.imageSmoothingQuality = cfg.interp === "cubic" ? "high" : "low";
  midCtx.save();
  midCtx.translate(cfg.flip_h ? mw : 0, cfg.flip_v ? mh : 0);
  midCtx.scale(cfg.flip_h ? -1 : 1, cfg.flip_v ? -1 : 1);
  midCtx.drawImage(srcCv, 1, 1, COLS, ROWS, 0, 0, mw, mh);
  midCtx.restore();
  const big = midCtx.getImageData(0, 0, mw, mh), d = big.data, hot = !!cfg.hot_only;
  for (let i = 0; i < d.length; i += 4) {
    if (hot && d[i + 1] < 128) { d[i + 3] = 0; continue; }
    const n = d[i] * 3;
    d[i] = lut[n]; d[i + 1] = lut[n + 1]; d[i + 2] = lut[n + 2]; d[i + 3] = 255;
  }
  midCtx.putImageData(big, 0, 0);

  // 3. Blend onto the camera image at the configured opacity (the canvas clips to the frame).
  ctx.save();
  ctx.globalAlpha = +cfg.alpha;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(midCv, g.x0, g.y0, g.rw, g.rh);
  ctx.restore();

  if (!cfg.show_hud) return;
  const at = i => [g.ax * (i % COLS) + g.bx, g.ay * Math.floor(i / COLS) + g.by];
  const inside = (x, y) => x >= 0 && x < W && y >= 0 && y < H;
  if (cfg.show_outline) { ctx.strokeStyle = "#fff"; ctx.lineWidth = Math.max(1, k); ctx.strokeRect(g.x0, g.y0, g.rw, g.rh); }

  let [x, y] = at(th.imax);
  if (inside(x, y)) {
    marker(ctx, x, y, 18 * k, 2 * k, "#ff0000");
    hudText(ctx, th.max.toFixed(1) + "C", Math.min(x + 8 * k, W - 60 * k), Math.max(y - 8 * k, 14 * k), 0.5, "rgb(255,80,80)", k);
  }
  [x, y] = at(th.imin);
  if (inside(x, y)) marker(ctx, x, y, 12 * k, Math.max(1, k), "rgb(0,160,255)", true);

  const cx = W / 2, cy = H / 2;
  marker(ctx, cx, cy, 14 * k, Math.max(1, k), "#fff");
  const rx0 = Math.min(g.x0, g.x0 + g.rw), rx1 = Math.max(g.x0, g.x0 + g.rw);
  const ry0 = Math.min(g.y0, g.y0 + g.rh), ry1 = Math.max(g.y0, g.y0 + g.rh);
  if (cx >= rx0 && cx < rx1 && cy >= ry0 && cy < ry1)
    hudText(ctx, sample((cx - g.bx) / g.ax, (cy - g.by) / g.ay).toFixed(1) + "C", cx + 8 * k, cy + 18 * k, 0.5, "#fff", k);

  // Scale bar on the right.
  if (barFor !== cfg.colormap) {
    const bctx = barCv.getContext("2d"), bi = bctx.createImageData(1, 256);
    for (let i = 0; i < 256; i++) {
      const n = (255 - i) * 3;
      bi.data.set([lut[n], lut[n + 1], lut[n + 2], 255], i * 4);
    }
    bctx.putImageData(bi, 0, 0); barFor = cfg.colormap;
  }
  const bh = Math.round(H * 0.5), bw = 12 * k, bx = W - 22 * k, by = (H - bh) / 2;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(barCv, bx, by, bw, bh);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = Math.max(1, k); ctx.strokeRect(bx - k, by - k, bw + 2 * k, bh + 2 * k);
  hudText(ctx, hi.toFixed(1), bx - 44 * k, by + 10 * k, 0.42, "#fff", k);
  hudText(ctx, lo.toFixed(1), bx - 44 * k, by + bh, 0.42, "#fff", k);

  hudText(ctx, `max ${th.max.toFixed(1)}  min ${th.min.toFixed(1)}  amb ${(+th.amb).toFixed(1)} C`, 10 * k, 22 * k, 0.55, "#fff", k);
  hudText(ctx, `browser drawing  thermal ${thFps.toFixed(1)} fps`, 10 * k, H - 10 * k, 0.45, "#fff", k);
}

document.querySelector(".seg").onclick = e => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); };
window.addEventListener("resize", draw);
setInterval(() => { if (mode === "browser") draw(); }, 500);   // notices when thermal data goes stale

(async () => {
  try { palettes = await api("/api/palettes"); } catch (e) { msg("Cannot load palettes: " + e.message); }
  setMode(mode);
  try { await load(); } catch (e) { msg("Cannot load config: " + e.message); }
})();
pollStats(); setInterval(pollStats, 2000);
</script>
</body>
</html>
